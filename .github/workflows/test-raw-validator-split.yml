name: Test RAW validator split

on:
  push:
    branches:
      - location-state-test

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[validator-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-state-test
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile minimax.py tests/test_director_retry.py tests/test_postmortem_regressions.py
      - name: Run focused tests
        run: python -m unittest tests.test_director_retry.DirectorMicroPromptPipelineTests.test_raw_scene_physical_prompt_is_narrow_and_checks_order tests.test_director_retry.DirectorMicroPromptPipelineTests.test_request_one_retries_physically_incoherent_raw_scene tests.test_director_retry.DirectorMicroPromptPipelineTests.test_request_one_retries_prop_state_failure_separately tests.test_postmortem_regressions.PostmortemRegressionTests.test_director_physical_requires_end_state_to_match_final_timed_action tests.test_postmortem_regressions.PostmortemRegressionTests.test_director_transfer_rule_is_generic_and_tracks_source_destination tests.test_postmortem_regressions.PostmortemRegressionTests.test_director_prop_state_preserves_assigned_transfer_destination_and_final_prop tests.test_postmortem_regressions.PostmortemRegressionTests.test_director_physical_receives_previous_shot_end tests.test_postmortem_regressions.PostmortemRegressionTests.test_raw_validator_split_keeps_domains_separate
