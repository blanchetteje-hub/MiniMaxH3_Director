name: Apply Picture authority fix

on:
  push:
    branches:
      - location-state-test

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[picture-authority]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: location-state-test
      - name: Apply fix
        run: python tools/apply_picture_authority_fix.py
      - name: Syntax check
        run: python -m py_compile minimax.py
      - name: Smoke assertions
        run: |
          python - <<'PY'
          import ast
          src = open('minimax.py', encoding='utf-8').read()
          ast.parse(src)
          assert 'protected_picture_ids=generated_picture_ids' in src
          assert "opening pose, position, and physical state" in src
          assert "opening pose, wardrobe, position" not in src
          print('smoke assertions passed')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minimax.py
          git commit -m "fix: preserve generated Picture authority [picture-authority]"
          git push origin HEAD:location-state-test
