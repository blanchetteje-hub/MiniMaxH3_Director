[pytest]
testpaths = tests
pythonpath = .
addopts = -p pytest_comfy_stubs --import-mode=importlib
markers =
	live_llm: mark tests that contact live LLM services so they can be skipped
	real_dino: mark tests that run the real local Grounding DINO model
	real_identity: mark tests that run the real local InsightFace model
